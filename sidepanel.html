<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Apple TV+ Subtitle Panel</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <style>
      /* デバッグパネル */
      #debug-section {
        border-top: 1px solid #333;
        background: #111;
        color: #0f0;
        font-family: monospace;
        font-size: 11px;
        flex-shrink: 0;
      }
      #debug-toggle {
        width: 100%;
        background: #1a1a1a;
        color: #888;
        border: none;
        padding: 4px 8px;
        text-align: left;
        cursor: pointer;
        font-size: 11px;
        font-family: monospace;
      }
      #debug-toggle:hover { background: #222; }
      #debug-body { display: none; }
      #debug-body.open { display: flex; flex-direction: column; }
      #debug-log {
        height: 140px;
        overflow-y: auto;
        padding: 4px 8px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #debug-actions {
        display: flex;
        gap: 4px;
        padding: 4px 8px;
        border-top: 1px solid #222;
      }
      #debug-actions button {
        flex: 1;
        background: #222;
        color: #aaa;
        border: 1px solid #333;
        border-radius: 3px;
        padding: 2px 4px;
        font-size: 10px;
        cursor: pointer;
      }
      #debug-actions button:hover { background: #333; color: #fff; }
    </style>
  </head>
  <body>
    <!-- メイン画面 -->
    <div
      id="main-screen"
      style="display: flex; flex-direction: column; height: 100%"
    >
      <header class="header">
        <div class="logo">
          <span class="logo-text">Apple TV+ Subtitle Panel</span>
        </div>
        <div class="header-actions">
          <button class="btn-icon" id="btn-freeze" title="字幕更新を一時停止">
            ⏸
          </button>
          <button class="btn-icon" id="btn-clear" title="履歴をクリア">
            🗑
          </button>
        </div>
      </header>

      <div class="track-selector">
        <div class="track-slot">
          <span class="slot-label slot-a">A</span>
          <select class="track-select" id="select-a">
            <option value="" disabled selected>
              — 動画を再生してください —
            </option>
          </select>
        </div>
        <div class="track-slot">
          <span class="slot-label slot-b">B</span>
          <select class="track-select" id="select-b">
            <option value="" disabled selected>
              — 動画を再生してください —
            </option>
          </select>
        </div>
      </div>

      <div class="current-section">
        <div class="lang-block">
          <div class="lang-label slot-a">A</div>
          <div class="current-text en-text" id="en-text">— 待機中 —</div>
        </div>
        <div class="lang-divider"></div>
        <div class="lang-block">
          <div class="lang-label slot-b">B</div>
          <div class="current-text ja-text" id="ja-text">— 待機中 —</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="history-section">
        <div class="history-label">HISTORY</div>
        <div class="history-list" id="history-list"></div>
      </div>

      <div class="status-bar">
        <div class="status-dot" id="status-dot"></div>
        <span class="status-text" id="status-text">起動中...</span>
      </div>

      <!-- デバッグパネル -->
      <div id="debug-section">
        <button id="debug-toggle">▶ DEBUG LOG</button>
        <div id="debug-body">
          <div id="debug-log"></div>
          <div id="debug-actions">
            <button id="btn-debug-copy">📋 コピー</button>
            <button id="btn-debug-save">💾 .txt 保存</button>
            <button id="btn-debug-clear">🗑 クリア</button>
          </div>
        </div>
      </div>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
